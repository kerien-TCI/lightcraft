plugins {
    id 'com.android.application'
}

def requestedAbi = providers.gradleProperty('requestedAbi').orElse('arm64-v8a').get()
if (!(requestedAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException("unsupported Android ABI: ${requestedAbi}")
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "io.github.kerien_tci.photolab"
        minSdk = 31
        targetSdk = 35
        versionCode = 8
        versionName = "0.21.1-android.8"
    }

    sourceSets {
        main {
            // The output directory of
            // `cargo ndk -t arm64-v8a -o apps/lightcraft-android/jniLibs build --release -p lightcraft-android`
            jniLibs.srcDirs = ['../../jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Debug signing for local testing, so the release APK installs with `adb install -r`.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
            ndk { abiFilters requestedAbi }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'ai.storyteller.lightcraft'
}

// Package the source and embedded-asset notices alongside the binary.
def androidNotices = tasks.register('androidNotices', Sync) {
    from('../../../..') { include 'NOTICE', 'LICENSE-MIT', 'LICENSE-APACHE' }
    from('../../../../assets/fonts') { include 'OFL-Inter.txt' }
    from('../../../../crates/ui-egui/locales') { include 'fr.json'; into 'locales' }
    into(layout.buildDirectory.dir('generated/androidNotices'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/androidNotices').get().asFile)
tasks.named('preBuild').configure { dependsOn(androidNotices) }
