[package]
name = "lightcraft-android"
description = "JNI bridge between the native Android editor and the LightCraft engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "main"
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
lightcraft-catalog = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
jni = "0.22"

[dev-dependencies]
lightcraft-merge = { workspace = true }
lightcraft-raster = { workspace = true }
tempfile = "3"
